[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "apva-langchain"
version = "3.0.0"
description = "LangChain callback handler and telemetry integration for APVA"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
dependencies = [
  "apva-framework>=3.0.0",
  "pydantic>=2.10.0,<3.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["apva_langchain*"]
