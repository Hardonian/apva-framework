[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "apva-framework"
version = "3.0.0"
description = "AI Productivity & Value Architecture: local-first TVY benchmarking, telemetry, CLI, and SDK."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
authors = [
  { name = "Hardonia AI Labs", email = "engineering@hardonia.ca" },
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "Intended Audience :: Information Technology",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
  "pydantic>=2.10.0,<3.0",
  "fastapi>=0.115.0,<1.0",
  "uvicorn[standard]>=0.30.0,<1.0",
  "pydantic-settings>=2.6.0,<3.0",
  "sqlalchemy[asyncio]>=2.0.30,<3.0",
  "aiosqlite>=0.20.0,<1.0",
  "celery[redis]>=5.4.0,<6.0",
  "redis>=5.0.0,<8.2",
  "httpx>=0.27.0,<1.0",
  "asyncpg>=0.29.0,<1.0",
]

[project.scripts]
apva = "apva.cli:main"

[project.urls]
Homepage = "https://aiautomatedsystems.ca"
Documentation = "https://docs.apva.ai"
Repository = "https://github.com/Hardonian/apva-framework"
Changelog = "https://github.com/Hardonian/apva-framework/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "pytest-asyncio>=1.3.0",
  "pytest-cov>=5.0.0",
  "ruff>=0.8.0",
  "mypy>=1.13.0",
  "httpx>=0.27.0,<1.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["apva*", "apps*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
asyncio_mode = "auto"
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
