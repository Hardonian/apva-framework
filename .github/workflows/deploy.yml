name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install & Test
        run: |
          pip install -e ".[dev]"
          pytest tests/ -x -q
          pytest apps/backend/tests/ -x -q

  deploy-api:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install wrangler
        run: npm install -g wrangler

      - name: Create D1 database (idempotent)
        continue-on-error: true
        working-directory: deploy/workers
        run: wrangler d1 create apva_framework || true

      - name: Apply D1 schema
        continue-on-error: true
        working-directory: deploy/workers
        run: |
          DB_ID=$(wrangler d1 list --json 2>/dev/null | python3 -c "import sys,json; dbs=json.load(sys.stdin); print([d['id'] for d in dbs if d.get('name')=='apva_framework'][0])" 2>/dev/null || echo "")
          if [ -n "$DB_ID" ]; then
            wrangler d1 execute apva_framework --remote --file=../d1/schema.sql
            # Update wrangler.toml with the real DB_ID
            sed -i "s/database_id = \".*\"/database_id = \"$DB_ID\"/" wrangler.toml
          fi
          if [ -n "${{ vars.DOMAIN }}" ]; then
            printf "\n[[routes]]\npattern = \"%s\"\ncustom_domain = true\n" "${{ vars.DOMAIN }}" >> wrangler.toml
          fi

      - name: Deploy to Cloudflare Workers
        working-directory: deploy/workers
        run: wrangler deploy --minify
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}

      - name: Smoke test
        run: |
          sleep 5
          curl -s https://${{ vars.DOMAIN }}/health | python3 -m json.tool || echo "Health check skipped"

  deploy-frontend:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: apps/dashboard/package-lock.json

      - name: Build Dashboard
        working-directory: apps/dashboard
        run: |
          npm ci
          npm run build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          projectName: ${{ github.event.repository.name }}
          directory: apps/dashboard/dist
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}